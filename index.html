<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>nuc7ear</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { background: #000; color: #fff; }
    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .container {
      padding: 2rem 5vw;
      text-align: center;
      transform: translate(var(--x, 0px), var(--y, 0px));
      transition: transform 250ms ease-out;
      animation: fade-in 1s ease-out both;
    }
    h1 {
      margin: 0;
      font: 900 clamp(2.6rem, 12vw, 9rem)/1 "Arial Black", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: -.06em;
    }
    #name {
      border: 0;
      padding: 0;
      background: none;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
    }
    #name:focus-visible { outline: 2px solid #c6f602; outline-offset: 8px; }
    #intro {
      margin: 1.5rem 1rem 0;
      font: 400 clamp(.9rem, 2.5vw, 1.2rem)/1.5 Arial, sans-serif;
      letter-spacing: .06em;
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .container { transform: none; transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <main id="hero">
    <div class="container" id="text">
      <h1><button id="name" type="button" aria-expanded="false" aria-controls="intro">nuc7ear</button></h1>
      <p id="intro" hidden>3D · CAD · 视觉设计</p>
    </div>
  </main>
  <script>
    const hero = document.querySelector("#hero");
    const text = document.querySelector("#text");
    const nameButton = document.querySelector("#name");
    const intro = document.querySelector("#intro");
    const canMove = matchMedia("(hover: hover) and (pointer: fine)");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

    function resetPosition() {
      text.style.removeProperty("--x");
      text.style.removeProperty("--y");
    }

    hero.addEventListener("pointermove", (event) => {
      if (!canMove.matches || reducedMotion.matches) return;
      const rect = hero.getBoundingClientRect();
      text.style.setProperty("--x", ((event.clientX - rect.left) / rect.width - .5) * 24 + "px");
      text.style.setProperty("--y", ((event.clientY - rect.top) / rect.height - .5) * 24 + "px");
    });
    hero.addEventListener("pointerleave", resetPosition);
    canMove.addEventListener("change", resetPosition);
    reducedMotion.addEventListener("change", resetPosition);

    nameButton.addEventListener("click", () => {
      intro.hidden = !intro.hidden;
      nameButton.setAttribute("aria-expanded", String(!intro.hidden));
    });
  </script>
</body>
</html>
